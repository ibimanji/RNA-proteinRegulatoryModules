# ==========================================
# 0. Dataset Base Path
# ==========================================
# 本节用于集中修改当前数据集的根目录（如 /gpfs/share/home/2301920002/labShare/2301920002/ADdecon/8mWT_4mFAD）
# 之后如需切换数据集，只需改此处一行即可
dataset_base: "/gpfs/share/home/2301920002/labShare/2301920002/ADdecon/8mWT_4mFAD"

# ==========================================
# 1. Dataset Specs
# ==========================================
# 这一节描述“数据在哪里、每张图像长什么样、每轮有哪些通道”。
# 配置所有和 base 路径相关的参数时引用上方的 dataset_base 变量。
dataset:
  # 原始 TIFF 数据根目录。
  raw_data_path: "{dataset_base}/01_data"

  # 图像文件名模板。
  filename_pattern: "round{round:03d}/Position{fov:03d}/*ch{ch}*.tif"

  # 显微镜像素尺寸，单位 nm。
  pixel_size_xy_nm: 94.64
  pixel_size_z_nm: 340.00

  dimensions:
    z: 42
    width: 3072
    height: 3072

  io_chunk_size:
    z: 42
    y: 1536
    x: 1536

  # --- 显式结构定义 (Explicit Structure) ---
  fov_list: "1"

  round_structure:
    1: [0, 1, 2]
    2: [0, 1, 2]
    3: [0, 1, 2]
    4: [0, 1, 2]
    5: [0, 1, 2]
    6: [0, 1, 2]
    7: [0, 1, 2]
    8: [0, 1, 2]
    9: [0, 1, 2]
    10: [0, 1, 2]
    11: [0, 1, 2]

  channel_roles:
    0: "seq"
    1: "seq"
    2: "seq"
    #3: "anchor"

# ==========================================
# 2. Decoding Logic
# ==========================================
codebook:
  gene_list: "{dataset_base}/01_data/genes.csv"
  channel_base_index: 1

  encoding_tables:
    standard_3color:
      "AT": 3
      "GT": 1
      "TT": 2
      "AG": 1
      "GG": 2
      "TG": 3
      "AA": 2
      "GA": 3
      "TA": 1

    standard_4color:
      "AA": 1
      "CA": 2
      "GA": 3
      "TA": 4
      "AC": 2
      "CC": 1
      "GC": 4
      "TC": 3
      "AG": 3
      "CG": 4
      "GG": 1
      "TG": 2
      "AT": 4
      "CT": 3
      "GT": 2
      "TT": 1

    omics_special:
      "GC": 2
      "GT": 1

  topology:
    func: "reverse_string"
    structure:
      - id: "seqF"
        length: 6
        rounds: [6, 7, 8, 9, 10]
        csv_slice: [1, 6]
        anchor_base: ["A", "A"]
        encoding_table: "standard_3color"
      - id: "seqD"
        length: 6
        rounds: [1, 2, 3, 4, 5]
        csv_slice: [7, 12]
        anchor_base: ["G", "A"]
        encoding_table: "standard_3color"
      - id: "seqE"
        length: 2
        rounds: [11]
        csv_slice: [13, 14]
        anchor_base: ["G"]
        encoding_table: "omics_special"
    physical_order: ["seqD", "seqF", "seqE"]

# ==========================================
# 3. Provider Runtime Configuration
# ==========================================
providers:
  matlab:
    enabled: true
    preprocessing:
      runtime_path: "matlab_runtime/pystar_preprocessing"
      entrypoint: "pystar_preprocess_entry"
      loader_input_format: "uint8"
      loader_output_dtype: "uint8"
      use_gpu: false
      morphology:
        method: "2d"
        radius: 6
        height: 3
    registration:
      runtime_path: "matlab_runtime/pystar_registration"
      entrypoint: "pystar_register_global_entry"
      local_entrypoints:
        demons_3d: "pystar_register_local_demons_entry"
      volume_transfer_mode: "temporary_tiff"
      input_volume_dtype: "uint8"
      use_gpu: false
    spot_finding:
      runtime_path: "matlab_runtime/pystar_spotfinding"
      entrypoint: "pystar_spotfind_entry"
      volume_transfer_mode: "temporary_tiff"
      input_volume_dtype: "uint8"
    extraction:
      runtime_path: "matlab_runtime/pystar_extraction"
      entrypoint: "pystar_extract_entry"
      volume_transfer_mode: "temporary_tiff"
      coords_transfer_mode: "temporary_csv"
      input_volume_dtype: "float32"

# ==========================================
# 4. Pipeline Parameters
# ==========================================
pipeline:
  scope_mode: "full_fov"
  accelerator: "cpu"
  field_semantics:
    representation: "residual"
    composition: "sequential_global_then_local"
    status: "provisional"
  preprocessing:
    enable: true
    sequence:
      - method: "none"
        provider: "matlab"
        params: {}
      - method: "min_max_normalize"
        provider: "matlab"
        params: {}
      - method: "histogram_match"
        provider: "matlab"
        params:
          scope: "inter_round"
      - method: "histogram_match"
        provider: "matlab"
        params:
          scope: "intra_round"
      - method: "morpho_reconstruction_contrast"
        provider: "matlab"
        params:
          radius: 6
          downsample_factor: 0.25
  registration:
    reference_round: 1
    source:
      method: "mip_all_channels"
      mip_channels: [0, 1, 2]
    global:
      enabled: true
      method: "phase_corr_3d"
      provider: "native"
      params:
        downsample_factor: 1
        use_gpu: false
        max_shift: 200
    local:
      enabled: true
      method: "demons_3d"
      provider: "native"
      params:
        bspline:
          grid_spacing: 17
          num_iter: 70
        optical_flow:
          coarse_scale: 0.12
          blur_sigma: 1.9
          attachment: 2.0
          tightness: 0.45
          num_warp: 5
          num_iter: 10
          tol: 0.0001
        demons_3d:
          num_iter: 50
          smoothing_sigma: 1.0
    guards:
      skip_if_global_corr_below: 0.2
      reject_if_correlation_worse: true
    save_displacement_fields: true
    save_registered_images: false
  spot_finding:
    algorithm: "peak_local_max"
    provider: "native"
    reference_round: 1
    method: "max_intensity"
    spotiflow:
      model_name: "smfish_3d"
      prob_thresh: 0.5
      use_gpu: true
    blob_dog:
      min_sigma: [0.5, 1.0, 1.0]
      max_sigma: [2.0, 5.0, 5.0]
      threshold: 0.01
      overlap: 0.5
    peak_local_max:
      min_distance: 2
      threshold_rel: 0.1
      exclude_border: true
  extraction:
    method: "box_sum"
    provider: "native"
    integration_box: [3, 3, 3]
    handle_out_of_bounds: "pad_zero"
    transform_application_mode: "image_warp"
  output:
    directory: "{dataset_base}/02_pystar_output"
    export_directory: "{dataset_base}/02_registration"
    export_fov_digits: 3
    export_log_name: "log.out"
    export_goodpoints_name: "goodPoints_max3d.csv"
    save_decoded_csv: false
    save_pre_pattern_check_csv: false
    save_qc_images: false
  qc:
    enable: false
    alignment_check:
      roi_size: 512
      num_samples: 3
      blend_colors: ["green", "magenta"]
    correlation_plot:
      dpi: 150
      show_threshold: true

  # IF registration
  if_registration:
    enable: true
    runtime_path: "matlab_runtime/pystar_if_registration"
    entrypoint: "pystar_if_register_entry"
    sample: "{dataset_base | basename}"  # 假设有变量插值，或需在实际解析时用 Python/jinja2 解析
    user_dir: "{dataset_base | dirname}"  # 获取上一级目录
    source_data_dir: "01_data"
    registration_dir: "02_registration"
    protein_folder: "IF"
    protein_round: "IF"
    protein_stains: ["PI", "X34", "amplicon"]
    registration_channel: 3